<!-- _includes/carousel.html -->
<div class="carousel-container">
  <div class="carousel-slides">
    {% for slide in include.slides %}
      <div class="slide {% if forloop.first %}active{% endif %}">
        <!-- Added site.baseurl to guarantee GitHub Pages paths resolve correctly -->
        <img src="{{ slide.image | relative_url }}" alt="Project Screenshot">
        
        {% if slide.text or slide.link != "" %}
          <div class="slide-caption">
            {% if slide.text %}<p>{{ slide.text }}</p>{% endif %}
            {% if slide.link != "" and slide.link != nil %}
              <a href="{{ slide.link | relative_url }}" class="caption-link" target="_blank" rel="noopener">Learn More &rarr;</a>
            {% endif %}
          </div>
        {% endif %}
      </div>
    {% endfor %}
  </div>
  <button class="prev" onclick="moveSlide(-1)">&#10094;</button>
  <button class="next" onclick="moveSlide(1)">&#10095;</button>
</div>

<style>
  .carousel-container { position: relative; max-width: 100%; margin: auto; overflow: hidden; background: #222; min-height: 200px; }
  .carousel-slides .slide { display: none; position: relative; }
  .carousel-slides .slide.active { display: block; }
  .carousel-slides img { width: 100%; height: auto; display: block; }
  
  .slide-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    padding: 15px;
    font-size: 14px;
  }
  .slide-caption p { margin: 0 0 5px 0; color: #fff; }
  .caption-link { color: #3498db; text-decoration: none; font-weight: bold; }
  .caption-link:hover { text-decoration: underline; }

  .prev, .next { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; padding: 10px; border: none; cursor: pointer; z-index: 10; font-size: 18px; }
  .next { right: 0; }
  .prev:hover, .next:hover { background: rgba(0,0,0,0.8); }
</style>


<script>
  if (typeof slideIndex === 'undefined') {
    var slideIndex = 0;
  }
  
  function moveSlide(n) {
    const slides = document.querySelectorAll('.slide');
    if (slides.length === 0) return;
    slides[slideIndex].classList.remove('active');
    slideIndex = (slideIndex + n + slides.length) % slides.length;
    slides[slideIndex].classList.add('active');
  }

  // --- AUTOMATIC ROTATION CODE ---
  // Change 4000 to whatever time you want in milliseconds (e.g., 4000 = 4 seconds)
  const autoRotateInterval = 4000; 
  
  let slideTimer = setInterval(function() {
    moveSlide(1);
  }, autoRotateInterval);

  // OPTIONAL USER EXPERIENCE: Pause rotation when the user hovers over the carousel
  const carouselContainer = document.querySelector('.carousel-container');
  if (carouselContainer) {
    carouselContainer.addEventListener('mouseenter', () => {
      clearInterval(slideTimer);
    });
    
    carouselContainer.addEventListener('mouseleave', () => {
      slideTimer = setInterval(function() {
        moveSlide(1);
      }, autoRotateInterval);
    });
  }
</script>
